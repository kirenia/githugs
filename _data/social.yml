# the footer row in order. `field` names the _config.yml key with the handle
# so dropping the key either place drops the link. `icon` is a font awesome
# class. `full: true` means the config value is a whole link used as is.
# six plus the tip jar: the places i would rather you find me. instagram
# and tiktok are for finding people so they are parked, this site is home.
# email and rss are left off on purpose: email is in the hello and rss is
# in the bar. everything else is parked at the bottom of this file ready
# to switch back on
- field: bluesky_username
  title: bluesky
  class: soc soc--bs
  icon: fa-brands fa-bluesky
  url: https://bsky.app/profile/
- field: mastodon_username
  title: mastodon
  class: soc soc--mast
  icon: fa-brands fa-mastodon
  url: https://mastodon.social/@
# no upscrolled glyph in the icon font so it borrows the film strip. it is
# where the videos go
- field: upscrolled_url
  title: upscrolled
  class: soc soc--up
  icon: fa-solid fa-film
  full: true
  label: upscrolled
- field: tumblr_username
  title: tumblr
  class: soc soc--tb
  icon: fa-brands fa-tumblr
  url: https://www.tumblr.com/
- field: patreon_username
  title: patreon
  class: soc soc--pat
  icon: fa-brands fa-patreon
  url: https://www.patreon.com/
- field: discord_invite
  title: discord
  class: soc soc--dc
  icon: fa-brands fa-discord
  full: true
  label: discord

