# the footer row, in order. `field` names the _config.yml key with the handle,
# so dropping the key either place drops the link. `icon` is a font awesome
# class. omg.lol's prami heart comes from their own font. `full: true` means
# the config value is a whole link, used as is.
# the dev site shows only these five. tiktok, omg.lol, email and rss were
# taken off here on purpose: email is in the hello, rss is in the header.
- field: bluesky_username
  title: bluesky
  icon: fa-brands fa-bluesky
  url: https://bsky.app/profile/
- field: github_username
  title: github
  icon: fa-brands fa-github
  url: https://github.com/
- field: patreon_username
  title: patreon
  icon: fa-brands fa-patreon
  url: https://www.patreon.com/
- field: discord_invite
  title: discord
  icon: fa-brands fa-discord
  full: true
  label: discord
- field: instagram_username
  title: instagram
  icon: fa-brands fa-instagram
  url: https://instagram.com/
