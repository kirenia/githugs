# posts anything new in _updates/ or _posts/ to every platform that has its
# secrets set.
# the work happens in scripts/syndicate.mjs, which is plain node and knows
# nothing about github, so this file is the only part that would need
# rewriting to run the same thing on codeberg, tangled or a cron job.
#
# a platform with no secrets is skipped, so adding one later means adding
# its secrets in settings > secrets and variables > actions. nothing here
# needs to change.

name: post updates

on:
  push:
    branches: [main]
    paths: ["_updates/**", "_posts/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "print what would go out and post nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: post
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: node scripts/syndicate.mjs

      # so a re-run can never post the same thing twice
      - name: remember what went out
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "githugs"
          git config user.email "githugs@proton.me"
          git add .syndicated.json
          git diff --staged --quiet || git commit -m "posted updates [skip ci]"
          git push
