{%- comment -%} one tag and its posts. takes name and posts. {%- endcomment -%}
<section class="tag-group" id="{{ include.name | slugify }}">
  <h2>{{ include.name }}</h2>
  <ul>
    {%- for post in include.posts -%}
      <li><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a> <small>{{ post.date | date: "%-d %b %Y" }}</small></li>
    {%- endfor -%}
  </ul>
</section>
