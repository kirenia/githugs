# site settings.
# jekyll does not reload this file while it's serving,
# restart after touching anything in here.

title: githugs(lol)
email: githugs@proton.me
description: >-
  Code, notes, and whatever else I'm building right now.

# the line in the footer's third column
footer_quote: >-
  We can restore the web as a tool for collaboration, creativity and
  compassion across cultural borders.
footer_quote_by: Tim Berners-Lee
footer_quote_cite: "This Is for Everyone: The Unfinished Story of the World Wide Web"
footer_quote_year: 2025

# without this, dates render in the build machine's timezone: mountain on
# my laptop, UTC on github pages, so an evening post shows the wrong day
timezone: America/Boise

baseurl: "" # user pages (kirenia.github.io) are served from the root
url: "https://githugs.lol" # the domain in CNAME, not the github.io one

# uncomment to put the "edit this post" links back under every post
# repo_url: https://github.com/kirenia/kirenia.github.io
# repo_branch: main

instagram_username: githugs_
bluesky_username: githugs.lol
patreon_username: githugs

# the footer status line is pulled live from this omg.lol address
omg_address: kire

# no theme gem: the layouts, includes and CSS in this repo are the theme.
plugins:
  - jekyll-feed
  - jekyll-redirect-from

permalink: /:year/:month/:day/:title/

# the first blank line ends the blurb shown on the home page cards
excerpt_separator: "\n\n"

# so posts don't have to name their layout in front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
